<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- semaine 6 -->
    <div class="grid">
      <div id="grid-info">
        <h2>Search info</h2>
        <div class="flight-departure-destination">
          <p>From Geneva</p>
          <p>To San Fransisco</p>
        </div>
        <div class="dates">
          <p>From 31 May 2027</p>
          <p>To 15 June 2027</p>
        </div>
        <p>1 passenger</p>
        <button class="default small">reset Search</button>
      </div>

      <div id="grid-result">
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
        <include src="./components/card.html"></include>
      </div>
    </div>

    <!-- semaine 5 -->
    <div id="semaine-5">
      <div class="hero">
        <div class="hero-container">
          <header class="hero-header">
            <include src="./components/nav.html"></include>
          </header>
          <div class="hero-CTA">
            <h1>Ready for take off?</h1>
            <div class="filter"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- semaine 4 -->
    <include src="./components/nav.html"></include>

    <!-- semaine 2 -->
    <include src="./components/card.html"></include>

    <!--semaine 1 -->
    <div id="semaine-1">
      <div class="container" id="primary-container">
        <div class="group">
          <button class="default">Label</button>
          <button class="default small">Label</button>
        </div>
        <div class="group">
          <button class="default" disabled>Label</button>
          <button class="default small" disabled>Label</button>
        </div>
      </div>
      <div class="container" id="secondary-container">
        <div class="group">
          <button class="default secondary">Label</button>
          <button class="default secondary small">Label</button>
        </div>
        <div class="group">
          <button class="default secondary" disabled>Label</button>
          <button class="default secondary small" disabled>Label</button>
        </div>
      </div>
    </div>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
